## A second agent reads the pull request the first one just opened.
##
## It starts from the issue's acceptance criteria, not the diff, and it has
## never seen the reasoning that produced the change — which is the whole
## point. The agent that built it cannot see its own misreading.
##
## It comments and never blocks. A human merges.
##
## Triggered by the pull request itself. An earlier version keyed off the ship
## workflow finishing, which does not work: a run started by an `issues`
## event reports `head_branch` as `main`, so the lookup for its pull request
## found nothing and these passes never ran.
name: 🔍 Agent · code review

on:
  pull_request:
    # `opened` and `ready_for_review`, never `synchronize`.
    #
    # One pull request costs one pass of each. `synchronize` was the expensive
    # part — it charged for a review on every push, and a fourteen-commit
    # branch paid fourteen times for one change.
    #
    # Want another look after pushing fixes? Put it back to draft and mark it
    # ready again.
    types: [opened, reopened, ready_for_review]

# A new commit makes the pass already running pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fresh-context:
    outputs:
      escape: ${{ steps.escape.outputs.escape }}
      finding: ${{ steps.escape.outputs.finding }}
    # A draft is what `ship` opens when it hands a ticket back: it already
    # knows what is wrong, and says so on the pull request. Marking it ready
    # is what asks for this pass.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read
      pull-requests: write
      issues: write         # file a follow-up issue for anything that did not block
      checks: write         # publish the verdict as a check on the PR
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the review reads the diff against main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # claude-code-action drives the Agent SDK, which stops at the first
      # result — and a saved workflow's first result is its launcher saying
      # "running in the background". The action ended there and the workflow
      # died unstarted, reporting success. The CLI waits; see agent-run.sh.
      - name: 📦 Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: 🔍 Run /code-review
        # The agent crashing is not the same as the change being wrong; its
        # verdict is the signal, and the step below is what acts on it.
        continue-on-error: true
        timeout-minutes: 30
        env:
          # `claude -p` stops waiting for a background workflow after 600s and
          # kills it — /ship on #34 died that way, ten minutes in. The step's
          # timeout-minutes is the bound instead.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GITHUB_TOKEN deliberately: this pass only comments, and with a
          # personal token its comments would read as the author reviewing
          # their own pull request.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The agents run `gh` too — `gh pr view` for the head sha and for
          # the verdict marker the last pass left. Unpinned, `gh` resolves a
          # fork's base repo to the upstream, where pull request #42 is
          # somebody else's, and the re-review would scope itself to it.
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEPTH: ${{ vars.REVIEW_DEPTH || 'balanced' }}
          TICKET: ${{ contains(github.event.pull_request.labels.*.name, 'ship:full') && 'full' || '' }}
          # Neither ticket needing this asks for a pre-checkout post — there
          # is no "within about a minute" criterion here — so these three are
          # what let agent-run.sh start the follower at all, and what it
          # needs to find the one-line status it maintains on the PR.
          SHIP_PROGRESS_PR: ${{ github.event.pull_request.number }}
          SHIP_PROGRESS_KIND: review
          SHIP_PROGRESS_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The harness must not review itself: a pull request that edits the
          # review workflow, its playbook or CLAUDE.md would otherwise be
          # judged by its own version of them. Run the base branch's.
          for p in .claude CLAUDE.md docs/harness scripts/agent-run.sh scripts/agent-summary.mjs scripts/qa-facts.mjs scripts/ship-progress.mjs scripts/ai-cost.mjs; do
            git cat-file -e "origin/$BASE:$p" 2>/dev/null && git checkout -q "origin/$BASE" -- "$p"
          done
          # How deep to review is the team's dial (Settings → Variables →
          # REVIEW_DEPTH: fast | balanced | thorough) applied to facts from git;
          # code-review.js's tierFor() decides light or full.
          # The ticket's size: ship labels a pull request it sized full; one it
          # built without the label was a small ticket; anyone else's, unknown.
          ticket=${TICKET:-$(case "$HEAD_REF" in issue-[0-9]*-*) echo small ;; esac)}
          facts=$(node scripts/qa-facts.mjs "origin/$BASE" --ticket="$ticket" --depth="$DEPTH")
          case "$HEAD_REF" in issue-[0-9]*-*) shipped=yes ;; *) shipped=no ;; esac
          scripts/agent-run.sh "/code-review $PR --no-publish $facts --shipped=$shipped --depth=$DEPTH" "Workflow,Bash,Read,Glob,Grep" claude-opus-5

      # The ticket's running AI spend gains this pass's row (see agent-ship.yml).
      - name: 🧾 Record the AI spend
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh pr view "$PR" --json closingIssuesReferences -q '.closingIssuesReferences[0].number' 2>/dev/null || true)
          node scripts/ai-cost.mjs record ${issue:+--issue "$issue"} --kind "code review" --run "$RUN" --stream "$RUNNER_TEMP/claude-run.jsonl" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The transcript is the only record of what the agent did. Without it a
      # run that dies mid-way (#61: exit 1 after 18 minutes, nothing in the
      # log) cannot be diagnosed, and the job summary is not readable from
      # the API. Kept two weeks, uploaded whatever happened.
      - name: 🗂️ Keep the transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: transcript-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/claude-run.jsonl
            ${{ runner.temp }}/workflow-result.json
          if-no-files-found: ignore
          retention-days: 14

      # A killed step takes the follower with it, mid-line — this is what
      # settles the one-line status afterwards. See agent-ship.yml and
      # docs/context/harness.md.
      - name: 🏁 Finish the progress comment
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHIP_PROGRESS_PR: ${{ github.event.pull_request.number }}
          SHIP_PROGRESS_KIND: review
          SHIP_PROGRESS_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ship-progress.mjs finish

      # A FAIL on a pull request that ship built (branch issue-<n>-…) is an
      # escape: the independent pass caught what ship's own loop let through.
      # Labelled so they can be counted, and handed to learn-escape.yml.
      - name: 🧯 Flag a harness escape
        id: escape
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          line=$(jq -r '.verdictLine // empty' "$RUNNER_TEMP/workflow-result.json" 2>/dev/null || true)
          case "$HEAD_REF" in issue-[0-9]*-*) shipped=yes ;; *) shipped=no ;; esac
          if [ "$shipped" = yes ] && [ "${line%% *}" = FAIL ]; then
            gh pr edit "$PR" --add-label harness-escape || true
            { echo "escape=true"; echo "finding<<__FINDING__"; printf '%s\n' "${line#FAIL }"; echo "__FINDING__"; } >> "$GITHUB_OUTPUT"
            echo "### 🧯 Harness escape — ship's loop let this through: ${line#FAIL }" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Red means a blocker was found, not that merging is forbidden — nothing
      # here is a required check. It puts the blocker where a skim-reader sees
      # it instead of three comments down.
      - name: 📣 Publish the verdict
        if: ${{ !cancelled() }}
        env:
          # Check runs can only be created by a GitHub App. GITHUB_TOKEN is
          # one; a personal access token is not, and the API rejects it — so
          # this step does not take the AGENT_GITHUB_TOKEN the others use.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The workflow returns its comment and verdict line; this step posts
          # them. No model sits between the verdict and the check.
          result="$RUNNER_TEMP/workflow-result.json"
          field() { jq -r --arg k "$1" '.[$k] // empty' "$result" 2>/dev/null || true; }
          field comment > "$RUNNER_TEMP/comment.md"
          [ -s "$RUNNER_TEMP/comment.md" ] && gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          verdict=$(field verdictLine | head -c 2000 | tr '\n' ' ')
          state=$(printf '%s' "$verdict" | awk '{print $1}')
          confidence=$(printf '%s' "$verdict" | awk '{print $2}')
          detail=$(printf '%s' "$verdict" | cut -d' ' -f3-)

          case "$state" in
            FAIL)
              conclusion=failure
              title='Fresh-context review — blocker'
              summary=$(printf '%s' "$verdict" | cut -d' ' -f2-)
              ;;
            PASS)
              # A pass the agent could barely justify is not a green tick. It
              # publishes as neutral, which reads as "nobody verified this"
              # rather than "this is fine".
              case "$confidence" in
                high)   conclusion=success; title='Fresh-context review — high confidence' ;;
                medium) conclusion=success; title='Fresh-context review — medium confidence' ;;
                low)    conclusion=neutral; title='Fresh-context review — low confidence, treat as unproven' ;;
                *)      conclusion=neutral; title='Fresh-context review — no confidence stated' ;;
              esac
              summary="$detail"
              ;;
            *)
              conclusion=neutral
              title='Fresh-context review — did not finish'
              summary='No verdict written. Treat as unproven.'
              ;;
          esac

          gh api "repos/$GH_REPO/check-runs" \
            -f name='🔍 Code review verdict' \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=${summary:-see the pull request comment}" \
            --silent

          echo "verdict: ${verdict:-<none>} → $conclusion"
          [ "$conclusion" != "failure" ]

      # A follow-up is real but nobody hits it in normal use, so it never
      # turns the check red — which means filing it is the only way it
      # survives the thread. Ungated on the outcome above: a red review and a
      # green one hand this the same field, and the only way to lose a
      # follow-up is a condition somebody has to remember. An empty or absent
      # array is a no-op, which is what makes that safe.
      - name: 📌 File follow-ups
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          result="$RUNNER_TEMP/workflow-result.json"
          n=$(jq -r '(.followUps // []) | length' "$result" 2>/dev/null || echo 0)
          [ "${n:-0}" -gt 0 ] || { echo "no follow-ups"; exit 0; }
          i=0
          while [ "$i" -lt "$n" ]; do
            title=$(jq -r --argjson i "$i" '.followUps[$i].title // empty' "$result" | head -c 200)
            jq -r --argjson i "$i" '.followUps[$i].body // empty' "$result" > "$RUNNER_TEMP/follow-up.md"
            i=$((i + 1))
            [ -n "$title" ] || continue
            # Better an unlabelled issue than a lost one: a fork that never
            # ran setup.yml has no follow-up label, and --label on a missing
            # one is a hard error.
            url=$(gh issue create --title "$title" --body-file "$RUNNER_TEMP/follow-up.md" --label follow-up) \
              || url=$(gh issue create --title "$title" --body-file "$RUNNER_TEMP/follow-up.md") \
              || { echo "could not file: $title"; continue; }
            echo "- [$title]($url)" >> "$GITHUB_STEP_SUMMARY"
          done

  learn:
    needs: fresh-context
    if: ${{ always() && needs.fresh-context.outputs.escape == 'true' }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/learn-escape.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      source: code review
      finding: ${{ needs.fresh-context.outputs.finding }}
    secrets: inherit
