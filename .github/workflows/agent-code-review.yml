## A second agent reads the pull request the first one just opened.
##
## It starts from the issue's acceptance criteria, not the diff, and it has
## never seen the reasoning that produced the change — which is the whole
## point. The agent that built it cannot see its own misreading.
##
## It comments and never blocks. A human merges.
##
## Triggered by the pull request itself. An earlier version keyed off the ship
## workflow finishing, which does not work: a run started by an `issues`
## event reports `head_branch` as `main`, so the lookup for its pull request
## found nothing and these passes never ran.
name: Agent · code review

on:
  pull_request:
    # `opened` and `ready_for_review`, never `synchronize`.
    #
    # One pull request costs one pass of each. `synchronize` was the expensive
    # part — it charged for a review on every push, and a fourteen-commit
    # branch paid fourteen times for one change.
    #
    # Want another look after pushing fixes? Put it back to draft and mark it
    # ready again.
    types: [opened, reopened, ready_for_review]

# A new commit makes the pass already running pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fresh-context:
    outputs:
      escape: ${{ steps.escape.outputs.escape }}
      finding: ${{ steps.escape.outputs.finding }}
    # A draft is what `ship` opens when it hands a ticket back: it already
    # knows what is wrong, and says so on the pull request. Marking it ready
    # is what asks for this pass.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: write         # publish the verdict as a check on the PR
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the review reads the diff against main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # claude-code-action drives the Agent SDK, which stops at the first
      # result — and a saved workflow's first result is its launcher saying
      # "running in the background". The action ended there and the workflow
      # died unstarted, reporting success. The CLI waits; see agent-run.sh.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run /code-review
        # The agent crashing is not the same as the change being wrong; its
        # verdict is the signal, and the step below is what acts on it.
        continue-on-error: true
        timeout-minutes: 30
        env:
          # `claude -p` stops waiting for a background workflow after 600s and
          # kills it — /ship on #34 died that way, ten minutes in. The step's
          # timeout-minutes is the bound instead.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GITHUB_TOKEN deliberately: this pass only comments, and with a
          # personal token its comments would read as the author reviewing
          # their own pull request.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The harness must not review itself: a pull request that edits the
          # review workflow, its playbook or CLAUDE.md would otherwise be
          # judged by its own version of them. Run the base branch's.
          for p in .claude CLAUDE.md docs/harness scripts/agent-run.sh scripts/agent-summary.mjs; do
            git cat-file -e "origin/$BASE:$p" 2>/dev/null && git checkout -q "origin/$BASE" -- "$p"
          done
          scripts/agent-run.sh "/code-review $PR --no-publish" "Workflow,Bash,Read,Glob,Grep" claude-opus-5

      # A FAIL on a pull request that ship built (branch issue-<n>-…) is an
      # escape: the independent pass caught what ship's own loop let through.
      # Labelled so they can be counted, and handed to learn-escape.yml.
      - name: 🧯 Flag a harness escape
        id: escape
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          line=$(jq -r '.verdictLine // empty' "$RUNNER_TEMP/workflow-result.json" 2>/dev/null || true)
          case "$HEAD_REF" in issue-[0-9]*-*) shipped=yes ;; *) shipped=no ;; esac
          if [ "$shipped" = yes ] && [ "${line%% *}" = FAIL ]; then
            gh pr edit "$PR" --add-label harness-escape || true
            { echo "escape=true"; echo "finding<<__FINDING__"; printf '%s\n' "${line#FAIL }"; echo "__FINDING__"; } >> "$GITHUB_OUTPUT"
            echo "### 🧯 Harness escape — ship's loop let this through: ${line#FAIL }" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Red means a blocker was found, not that merging is forbidden — nothing
      # here is a required check. It puts the blocker where a skim-reader sees
      # it instead of three comments down.
      - name: Publish the verdict
        if: ${{ !cancelled() }}
        env:
          # Check runs can only be created by a GitHub App. GITHUB_TOKEN is
          # one; a personal access token is not, and the API rejects it — so
          # this step does not take the AGENT_GITHUB_TOKEN the others use.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The workflow returns its comment and verdict line; this step posts
          # them. No model sits between the verdict and the check.
          result="$RUNNER_TEMP/workflow-result.json"
          field() { jq -r --arg k "$1" '.[$k] // empty' "$result" 2>/dev/null || true; }
          field comment > "$RUNNER_TEMP/comment.md"
          [ -s "$RUNNER_TEMP/comment.md" ] && gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          verdict=$(field verdictLine | head -c 2000 | tr '\n' ' ')
          state=$(printf '%s' "$verdict" | awk '{print $1}')
          confidence=$(printf '%s' "$verdict" | awk '{print $2}')
          detail=$(printf '%s' "$verdict" | cut -d' ' -f3-)

          case "$state" in
            FAIL)
              conclusion=failure
              title='Fresh-context review — blocker'
              summary=$(printf '%s' "$verdict" | cut -d' ' -f2-)
              ;;
            PASS)
              # A pass the agent could barely justify is not a green tick. It
              # publishes as neutral, which reads as "nobody verified this"
              # rather than "this is fine".
              case "$confidence" in
                high)   conclusion=success; title='Fresh-context review — high confidence' ;;
                medium) conclusion=success; title='Fresh-context review — medium confidence' ;;
                low)    conclusion=neutral; title='Fresh-context review — low confidence, treat as unproven' ;;
                *)      conclusion=neutral; title='Fresh-context review — no confidence stated' ;;
              esac
              summary="$detail"
              ;;
            *)
              conclusion=neutral
              title='Fresh-context review — did not finish'
              summary='No verdict written. Treat as unproven.'
              ;;
          esac

          gh api "repos/$GH_REPO/check-runs" \
            -f name='Code review verdict' \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=${summary:-see the pull request comment}" \
            --silent

          echo "verdict: ${verdict:-<none>} → $conclusion"
          [ "$conclusion" != "failure" ]

  learn:
    needs: fresh-context
    if: ${{ always() && needs.fresh-context.outputs.escape == 'true' }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/learn-escape.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      source: code review
      finding: ${{ needs.fresh-context.outputs.finding }}
    secrets: inherit
