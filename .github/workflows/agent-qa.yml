## An agent that tries to break the change, in a browser, after it passed.
##
## The suite being green is the gate; this is the pass that goes looking for
## what nobody wrote a test for — the empty agenda, the phone viewport, the
## fourth day, the second click. It boots the app and drives it.
##
## Unlike the review, **this one can stop a merge.** A reproducible bug is not
## advice. The agent writes a verdict, a shell step turns it into a check run
## on the pull request, and branch protection can require it.
##
## Triggered by the pull request itself. An earlier version keyed off the build
## workflow finishing, which does not work: a build started by an `issues`
## event reports `head_branch` as `main`, so the lookup for its pull request
## found nothing and these passes never ran.
name: Agent · QA

on:
  pull_request:
    # `opened` and `ready_for_review`, never `synchronize`.
    #
    # One pull request costs one pass of each. `synchronize` was the expensive
    # part — it charged for a review on every push, and a fourteen-commit
    # branch paid fourteen times for one change.
    #
    # Want another look after pushing fixes? Put it back to draft and mark it
    # ready again.
    types: [opened, reopened, ready_for_review]

# A new commit makes the pass already running pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exploratory:
    # A draft is what `ship` opens when it hands a ticket back: it already
    # knows what is wrong, and says so on the pull request. Marking it ready
    # is what asks for this pass.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # A killed run publishes nothing: QA on PR #38 hit 23 minutes mid-probe
    # and the check read "did not finish". This bounds a hung run, not a slow one.
    timeout-minutes: 45

    permissions:
      # write, so `scripts/pr-media.mjs` can put a screenshot on the pr-media
      # branch — a finding you can see beats one described in prose. The skill
      # forbids changing any code or opening a pull request; this is for the
      # image branch, which nothing merges from.
      contents: write
      pull-requests: write
      issues: write        # a one-line verdict back on the ticket
      checks: write         # publish the verdict as a check on the PR
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This pass is the browser. Without it there is nothing to drive.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # claude-code-action drives the Agent SDK, which stops at the first
      # result — and a saved workflow's first result is its launcher saying
      # "running in the background". The action ended there and the workflow
      # died unstarted, reporting success. The CLI waits; see agent-run.sh.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run /qa
        # The agent failing is not the same as the change failing. Its verdict
        # is the signal, and the step below is what acts on it.
        continue-on-error: true
        timeout-minutes: 40
        env:
          # `claude -p` stops waiting for a background workflow after 600s and
          # kills it — /ship on #34 died that way, ten minutes in. The step's
          # timeout-minutes is the bound instead.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          NO_OPEN: "1"
        run: |
          # The harness must not review itself: a pull request that edits the
          # review workflow, its playbook or CLAUDE.md would otherwise be
          # judged by its own version of them. Run the base branch's.
          for p in .claude CLAUDE.md docs/harness scripts/agent-run.sh scripts/agent-summary.mjs; do
            git cat-file -e "origin/$BASE:$p" 2>/dev/null && git checkout -q "origin/$BASE" -- "$p"
          done
          # Sonnet: this pass is coverage, not insight.
          scripts/agent-run.sh "/qa $PR --no-publish" "Workflow,Bash,Read,Write,Glob,Grep" claude-sonnet-5

      # The verdict is a file the agent writes, not a mood. No file means the
      # pass did not finish, which is not the same as finding nothing — say so
      # rather than quietly passing.
      - name: Publish the verdict
        if: ${{ !cancelled() }}
        env:
          # Check runs can only be created by a GitHub App. GITHUB_TOKEN is
          # one; a personal access token is not, and the API rejects it — so
          # this step does not take the AGENT_GITHUB_TOKEN the others use.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The workflow returns its comment, verdict line and a one-line note
          # for the issue; this step posts them. No model sits between the
          # verdict and the check.
          result="$RUNNER_TEMP/workflow-result.json"
          field() { jq -r --arg k "$1" '.[$k] // empty' "$result" 2>/dev/null || true; }
          field comment > "$RUNNER_TEMP/comment.md"
          if [ -s "$RUNNER_TEMP/comment.md" ]; then
            url=$(gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md")
            issue=$(field issue)
            if [ -n "$issue" ] && [ "$issue" != "0" ]; then
              { field issueNote; echo " → ${url:-$GITHUB_SERVER_URL/$GH_REPO/pull/$PR}"; } > "$RUNNER_TEMP/issue.md"
              gh issue comment "$issue" --body-file "$RUNNER_TEMP/issue.md" || true
            fi
          fi
          verdict=$(field verdictLine | head -c 2000 | tr '\n' ' ')
          state=$(printf '%s' "$verdict" | awk '{print $1}')
          confidence=$(printf '%s' "$verdict" | awk '{print $2}')
          detail=$(printf '%s' "$verdict" | cut -d' ' -f3-)

          case "$state" in
            FAIL)
              conclusion=failure
              title='Exploratory QA — blocker'
              summary=$(printf '%s' "$verdict" | cut -d' ' -f2-)
              ;;
            PASS)
              # A pass the agent could barely justify is not a green tick. It
              # publishes as neutral, which reads as "nobody verified this"
              # rather than "this is fine".
              case "$confidence" in
                high)   conclusion=success; title='Exploratory QA — high confidence' ;;
                medium) conclusion=success; title='Exploratory QA — medium confidence' ;;
                low)    conclusion=neutral; title='Exploratory QA — low confidence, treat as unproven' ;;
                *)      conclusion=neutral; title='Exploratory QA — no confidence stated' ;;
              esac
              summary="$detail"
              ;;
            *)
              conclusion=neutral
              title='Exploratory QA — did not finish'
              summary='No verdict written. Treat as unproven.'
              ;;
          esac

          gh api "repos/$GH_REPO/check-runs" \
            -f name='QA verdict' \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=${summary:-see the pull request comment}" \
            --silent

          echo "verdict: ${verdict:-<none>} → $conclusion"
          [ "$conclusion" != "failure" ]
