## Review feedback closes the loop without a terminal either.
##
## Leave an inline comment on a pull request — or a review, or a comment on the
## issue — mentioning @claude, and the agent reads it, makes the change, pushes
## to the same branch and replies.
##
## No `prompt` input, so the action runs in interactive mode: it waits for the
## trigger phrase rather than being told what to do up front.
name: Agent · respond

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Several review comments in a row are several requests, so they queue rather
# than cancel each other.
concurrency:
  group: agent-respond-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # A review carries its body on `review`, a comment on `comment`. The other
    # is null, and `contains(null, ...)` is false, so this covers both.
    # The second clause is the loop guard. With AGENT_GITHUB_TOKEN the agent
    # comments as a person, so the action's own bot-actor protection does not
    # apply — and a reply of its own that quoted `@claude` would trigger
    # another reply. Its reports all carry this marker.
    # On a plain issue `@claude` means "build this", which agent-ship.yml
    # handles with the ship loop; this job answers on pull requests only.
    if: |
      (contains(github.event.comment.body, '@claude') ||
       contains(github.event.review.body, '@claude')) &&
      !contains(github.event.comment.body, 'Claude finished') &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    # On #41 it confirmed a review blocker, found a second bug, and died at
    # 19 minutes before pushing either — out of turns. A fix plus the gate
    # needs room.
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A review comment usually asks for a behaviour change, so the agent needs
      # to be able to re-run the gate before it replies.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # This one pushes, so it takes the ship workflow's token: a push made with
          # GITHUB_TOKEN triggers no workflow, and the change made in answer to
          # a review would land with no CI run at all.
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # Interactive mode runs no skill, so it never picks up a skill's
          # `allowed-tools` grant — without this the agent can read and edit
          # files but cannot run a test, boot the app or touch the GitHub API. It answers review comments it has no way to verify.
          claude_args: >-
            --model claude-sonnet-5 --max-turns 150
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --append-system-prompt "You are answering a comment on a pull request in a repo with an engineering harness. Make the change asked for, and nothing else. Before you push, run node scripts/gate.mjs once and put its verdict in your reply: its ok field, and the unit and browser counts. If it is red, say what failed and do not claim the change works. If the comment asks you to build or redo a whole ticket, do not attempt it here: say that an @claude comment on the issue runs the ship workflow for that."
