## Label an issue `ready-for-ai` and it becomes a verified pull request.
## Nobody opens a terminal.
##
## The job runs one thing: the `ship` workflow (`.claude/workflows/ship.js`).
## That is a deterministic script, not a prompt — spec, spec audit, implement,
## then verify → independent code audit → fix, round after round, until a
## round comes back clean. Only then does it open the pull request and write
## up what the audits caught. A loop that will not converge hands the
## ticket to a person as a draft pull request instead.
##
## The runner is the isolation — it is a fresh machine per run, so there are no
## ports to allocate and no worktree to make. `scripts/lane.mjs` is for a laptop
## running several agents at once; here the agent has the whole machine.
##
## Needs an ANTHROPIC_API_KEY repository secret; `Set up the harness` says
## what else, and none of it is the Claude GitHub App.
name: Agent · ship

on:
  issues:
    types: [labeled]
  # `@claude` on an issue — "do this again", "build this" — is a request to
  # ship the ticket, so it runs the same loop as the label, with the comment
  # passed along as notes. `@claude` on a pull request is a request to change
  # that diff, and stays with agent-respond.yml.
  issue_comment:
    types: [created]

# One agent per ticket. Relabelling while a run is in flight must not start a
# second agent on the same issue.
# Keyed by label as well as issue. The agent claims its ticket by swapping
# `ready-for-ai` for `ai-working`, and with a PAT it does that as a person —
# so that swap fires `issues: labeled` too. The job's `if` skips it in a
# second, but a shared group would leave it queued behind the real ship run for
# the whole run, looking like a duplicate.
# A comment shares the label's group, so a comment and a label on the same
# ticket queue behind each other rather than shipping it twice at once.
concurrency:
  group: agent-ship-${{ github.event.issue.number }}-${{ github.event.label.name || 'ready-for-ai' }}
  cancel-in-progress: false

jobs:
  ship:
    # `labeled` fires for every label, so the filter is what makes this a
    # dispatch rather than a nuisance. A comment counts only on an issue (not
    # a pull request), only from someone with write access — it becomes part
    # of the agent's instructions — and never from the agent's own replies.
    if: |
      github.event.label.name == 'ready-for-ai' ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       !contains(github.event.comment.body, 'Claude finished') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # A clean ticket takes one audit round; a hard one takes four. Past this
    # it is not converging.
    timeout-minutes: 120

    permissions:
      contents: write        # push the branch
      pull-requests: write   # open the PR
      issues: write          # move the label, comment progress
      id-token: write        # the action's GitHub App authentication
      actions: read          # read CI results, so a red run can be understood

    steps:
      - uses: actions/checkout@v7
        with:
          # The agent branches off origin/main, so it needs more than a
          # single-commit checkout.
          fetch-depth: 0
          # The push token is set on the remote in the Run /ship step; a
          # persisted GITHUB_TOKEN header would silently win over it.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `/ship` gates itself on `scripts/gate.mjs`, which drives a real
      # browser — and so does the re-check after it. Without this nothing can
      # be proved and every round is red.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # claude-code-action drives the Agent SDK, which stops at the first
      # result — and a saved workflow's first result is its launcher saying
      # "running in the background". The action ended there and the workflow
      # died unstarted, reporting success. The CLI waits; see agent-run.sh.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run /ship
        timeout-minutes: 100
        env:
          # `claude -p` stops waiting for a background workflow after 600s and
          # kills it — /ship on #34 died that way, ten minutes in. The step's
          # timeout-minutes is the bound instead.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # With AGENT_GITHUB_TOKEN the pull request is authored by a person,
          # so its checks run without an Approve click; see github.md.
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          N: ${{ github.event.issue.number }}
          # From an @claude comment, what the person wrote rides along as
          # notes. An environment variable, never interpolated into the
          # script, so the comment cannot become shell.
          NOTES: ${{ github.event.comment.body }}
        run: |
          git config user.name "claude[bot]"
          git config user.email "noreply@anthropic.com"
          # Pushes use the same token as gh.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          scripts/agent-run.sh "/ship $N $NOTES" "Workflow,Bash,Read,Write,Edit,Glob,Grep" claude-opus-5

      # What the run left behind is read from the issue, not from how the
      # step exited: the agent step succeeds even when ship returned an error,
      # and a timeout or crash leaves the ticket on `ai-working`. So this runs
      # always, and acts on the label.
      #
      # When ship says it shipped, the gate is run once more here, by the
      # runner, on the pull request's head. ship already ran it — this is the
      # difference between an agent reporting green and a machine seeing it.
      - name: Check what the run left behind
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          labels=$(gh issue view "$N" --json labels --jq '.labels[].name')
          branch=$(git ls-remote --heads origin "issue-$N-*" | awk '{print $2}' | sed 's#refs/heads/##' | head -1)

          # Still `ready-for-ai`: the run never claimed the ticket, so it never
          # started. The first Actions runs did exactly this and reported
          # success; say so instead.
          if printf '%s\n' "$labels" | grep -qx ready-for-ai; then
            gh issue edit "$N" --add-label needs-human --remove-label ready-for-ai || true
            gh issue comment "$N" --body "The ship run ended without starting — the ticket was never claimed. The job summary has the transcript.

          [Run]($RUN) · relabel \`ready-for-ai\` to try again." || true
            echo "### Ship never started — handed back" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if printf '%s\n' "$labels" | grep -qx ai-working; then
            gh issue edit "$N" --add-label needs-human --remove-label ai-working || true
            gh issue comment "$N" --body "The ship run did not finish — it timed out, was cancelled, or stopped without handing back.${branch:+ Its work so far is on \`$branch\`.}

          [Run]($RUN) · relabel \`ready-for-ai\` to try again." || true
            echo "### Ship did not finish — handed back" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr=$(gh pr list --state open --head "$branch" --json number,isDraft --jq '.[] | select(.isDraft | not) | .number' | head -1)
          if [ -z "$branch" ] || [ -z "$pr" ]; then
            echo "### No ready pull request — nothing to re-check" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch -q origin "$branch" && git checkout -q FETCH_HEAD
          # The gate and the config that decides what it runs come from main,
          # not from the branch being judged — a fixer told to make the gate
          # green could otherwise have edited the gate. Each file separately,
          # so one main does not have yet cannot stop the other; GATE_PINNED
          # tells the gate those two differences are ours, not the branch's
          # uncommitted work. (This limits what the branch can change about
          # the gate, not what its code can reach: the checkout's credentials
          # are still on disk.)
          pinned=""
          for f in scripts/gate.mjs playwright.config.js; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              git show "origin/main:$f" > "$f" && pinned="$pinned,$f"
            fi
          done
          if env -u GH_TOKEN GATE_PINNED="$pinned" node scripts/gate.mjs > /tmp/gate.out; then verdict=green; else verdict=red; fi
          git checkout -q -- . 2>/dev/null || true
          {
            echo "### Gate re-run on #$pr: $verdict"
            echo
            echo '```json'
            cat test-results/gate.json 2>/dev/null || tail -c 2000 /tmp/gate.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict" = red ]; then
            gh pr ready "$pr" --undo || true
            gh issue edit "$N" --add-label needs-human --remove-label ready-for-human || true
            gh pr comment "$pr" --body "> [!CAUTION]
          > ### The gate is red on this branch
          > ship reported it green, but the runner's own re-run of \`node scripts/gate.mjs\` failed, so this is back to draft. [Run]($RUN)" || true
          fi
