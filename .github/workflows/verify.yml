## The same gate as `npm run verify` on a laptop: seed, start the app, drive it
## in a browser. The two Playwright projects run as separate jobs, so the checks
## on a pull request say which viewport broke, and each gets its own database
## rather than sharing one with the other.
##
## Both projects are Chromium, so that is the only browser we install.
name: ✅ verify

on:
  # `push` covers landings on main; `pull_request` covers everything on its
  # way there. Running both on every branch ran the whole suite twice for one
  # commit, which is where the duplicate checks on a pull request came from.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the running job pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit + API tests: no browser, no server, about a second. Runs beside the
  # Playwright jobs, so it costs nothing in wall-clock and fails fast when the
  # rules break.
  test:
    name: 🧩 Unit + API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: node --test
        run: npm run test:ci

      - name: Summarise the run
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary-node.mjs >> "$GITHUB_STEP_SUMMARY"

  playwright:
    name: ${{ matrix.project == 'mobile' && '📱' || '🖥️' }} Playwright · ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]

    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request diffs its merge commit against the base (HEAD^1),
          # so it needs both parents; the push to main needs one.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A pull request runs what ship's own gate would (gate.mjs ciSpecs):
      # the decks' spec only when it touches a deck, and a ship:fast one only
      # the specs its change reaches. CI works that out from the diff itself
      # rather than trusting a record of what the laptop ran. The push to main
      # runs the whole suite.
      - name: Scope the pull request
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
        run: |
          # The label from the pull request, not the event: `gh pr create
          # --label` can add it just after `opened` fires (as agent-qa.yml).
          fast=$(gh pr view "$N" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx 'ship:fast' && echo --fast || true)
          specs=$(node scripts/gate.mjs --specs HEAD^1 $fast)
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "Ran ${specs:-the whole suite}; main runs the whole suite after merge." >> "$GITHUB_STEP_SUMMARY"

      - name: Build the web app
        run: npm run build

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Without --with-deps: a fork's first pull request has no cache, and
      # the libraries are the next step's to judge.
      - name: 🎭 Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # The runner image ships Chrome, so its libraries are usually there
      # already; installing them anyway cost 43–141s of apt on every run.
      - name: Install Chromium system dependencies
        run: |
          node -e "require('@playwright/test').chromium.launch().then(b => b.close())" \
            || npx playwright install-deps chromium

      # `npm run verify` seeds the database, then Playwright starts the app
      # itself (API + Vite) and drives it.
      - name: Seed, start the app, run the ${{ matrix.project }} suite
        run: npm run verify -- --project=${{ matrix.project }} ${{ steps.scope.outputs.specs }}

      # Turn the run into a table on the Actions summary page, so a green run
      # still says how many tests ran and a red one names what failed.
      - name: Summarise the run
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs "${{ matrix.project }}" >> "$GITHUB_STEP_SUMMARY"

      # The HTML report and any failure traces, so a red run can be read
      # without reproducing it locally.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
